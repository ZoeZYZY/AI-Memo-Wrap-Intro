<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">AI Memo Wrap | Your AI-Native Efficiency Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, #f0fdf4 0%, #ffffff 100%); }
        .text-gradient { background: linear-gradient(to right, #00A3FF, #00D494); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-white text-slate-900">
    <nav class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="logo.svg" alt="Logo" class="w-10 h-10">
            <span class="font-extrabold text-xl tracking-tighter italic text-slate-900">AI Memo Wrap</span>
        </div>
        <div class="flex items-center gap-4 md:gap-8">
            <div class="hidden md:flex gap-8 text-sm font-medium text-slate-600">
                <a href="#features" id="nav-features" class="hover:text-[#00A3FF]">Features</a>
                <a href="privacy.html" id="nav-privacy" class="hover:text-[#00A3FF]">Privacy</a>
                <a href="terms.html" id="nav-terms" class="hover:text-[#00A3FF]">Terms</a>
            </div>
            <button id="lang-switcher" class="px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 text-xs font-bold hover:bg-slate-200 transition-all">
                <span id="lang-label">中文</span>
            </button>
            <a href="#" id="nav-download" class="bg-slate-900 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-lg">Download</a>
        </div>
    </nav>

    <section class="hero-gradient pt-20 pb-32 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <div id="hero-tag" class="inline-block px-4 py-1.5 mb-6 rounded-full bg-blue-50 text-blue-600 text-xs font-bold uppercase tracking-widest">Next-Gen Curation Tool</div>
            <h1 id="hero-title" class="text-6xl md:text-8xl font-black mb-8 leading-tight">Capture Thoughts,<br><span class="text-gradient">Smartly Wrapped</span></h1>
            <p id="hero-desc" class="text-xl text-slate-500 mb-12 max-w-2xl mx-auto">AI Memo Wrap is a browser extension designed for creators. Sync knowledge fragments directly to Notion.</p>
            <button id="hero-cta" class="bg-[#00A3FF] text-white px-10 py-4 rounded-2xl font-bold text-lg shadow-xl shadow-blue-200">Add to Chrome</button>
        </div>
    </section>

    <script>
        const translations = {
            en: {
                navFeatures: "Features", navPrivacy: "Privacy", navTerms: "Terms", navDownload: "Download", langLabel: "中文",
                heroTitle: 'Capture Thoughts,<br><span class="text-gradient">Smartly Wrapped</span>',
                heroDesc: "AI Memo Wrap is a browser extension designed for creators. Sync knowledge fragments directly to Notion.",
                heroCta: "Add to Chrome"
            },
            zh: {
                navFeatures: "功能特性", navPrivacy: "隐私政策", navTerms: "使用条款", navDownload: "立即下载", langLabel: "English",
                heroTitle: '灵感捕获，<br><span class="text-gradient">智能包裹</span>',
                heroDesc: "AI Memo Wrap 是一款专为创意人设计的浏览器插件。让知识碎片精准同步至你的 Notion。",
                heroCta: "添加到 Chrome"
            }
        };
        let currentLang = 'en';
        document.getElementById('lang-switcher').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            const t = translations[currentLang];
            document.getElementById('nav-features').innerText = t.navFeatures;
            document.getElementById('nav-privacy').innerText = t.navPrivacy;
            document.getElementById('nav-terms').innerText = t.navTerms;
            document.getElementById('nav-download').innerText = t.navDownload;
            document.getElementById('lang-label').innerText = t.langLabel;
            document.getElementById('hero-title').innerHTML = t.heroTitle;
            document.getElementById('hero-desc').innerText = t.heroDesc;
            document.getElementById('hero-cta').innerText = t.heroCta;
        });
    </script>
</body>
</html>
